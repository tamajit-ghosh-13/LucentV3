<!doctype html><html><head><meta charset="utf-8"><title>Lucent</title><style>
body{width:340px;margin:0;background:#071510;color:#edfdf3;font:14px/1.4 system-ui}.app{padding:18px}.head{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:800}.brand b{color:#69e69d}.sub{color:#9bb7a5;font-size:12px;margin:3px 0 16px}.toggle{border:0;border-radius:999px;padding:8px 13px;font-weight:800;cursor:pointer;background:#273c31;color:#cfe6d7}.toggle.on{background:#42c878;color:#062410}.card{border:1px solid #274936;background:#0c2016;border-radius:13px;padding:12px;margin:10px 0}.card h2{font-size:14px;margin:0 0 7px}.card p{font-size:12px;color:#a7c3b0;margin:0 0 8px}.row{display:flex;align-items:center;justify-content:space-between;padding:7px 0}.row label{font-weight:600}.row small{display:block;color:#8aa695;font-size:11px;font-weight:400}.switch{appearance:none;width:38px;height:22px;background:#3a5142;border-radius:20px;position:relative;cursor:pointer}.switch:checked{background:#46d87c}.switch:before{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:white;top:3px;left:3px;transition:.18s}.switch:checked:before{left:19px}.footer{font-size:11px;color:#84a38e;text-align:center;margin-top:12px}button.scan{width:100%;border:1px solid #3c8055;background:transparent;color:#8df4b5;border-radius:9px;padding:8px;cursor:pointer}</style></head><body><main class="app"><div class="head"><div><div class="brand">lu<b>cent</b></div><div class="sub">Your web, tuned for you.</div></div><button id="master" class="toggle">OFF</button></div><section class="card"><h2>🧠 Cognitive & ADHD</h2><p>Reduce noise and keep your place while reading.</p><div class="row"><label>De-clutter<small>Hide sidebars and ad-like elements</small></label><input class="switch" type="checkbox" data-path="cognitive.declutter"></div><div class="row"><label>Reading guide<small>Follow the cursor with a focus band</small></label><input class="switch" type="checkbox" data-path="cognitive.readingGuide"></div><div class="row"><label>Dyslexia-friendly text<small>More spacing and readable type</small></label><input class="switch" type="checkbox" data-path="cognitive.dyslexia"></div><div class="row"><label>Calm mode<small>Reduce motion and visual noise</small></label><input class="switch" type="checkbox" data-path="cognitive.calmMode"></div></section><section class="card"><h2>🖐 Motor & tremor</h2><p>Make controls easier to reach and activate.</p><div class="row"><label>48 px targets<small>Enlarge common interactive controls</small></label><input class="switch" type="checkbox" data-path="motor.targets"></div><div class="row"><label>Focus halo<small>Highly visible keyboard focus</small></label><input class="switch" type="checkbox" data-path="motor.focus"></div><div class="row"><label>Number shortcuts<small>Press 1–9 to activate labelled targets</small></label><input class="switch" type="checkbox" data-path="motor.shortcuts"></div><div class="row"><label>Steady click<small>Ignore accidental repeat clicks</small></label><input class="switch" type="checkbox" data-path="motor.steadyClick"></div></section><button class="scan" id="btn-scan">Run existing visual scan</button><div class="footer" id="status">Changes apply immediately to this tab.</div></main><script src="popup.js"></script></body></html>
